name: Threads stats

on:
  schedule:
    - cron: "40 15 * * *"   # 11:40 malam MYT setiap hari
  push:
    branches: [main]
    paths:
      - "scripts/threads_stats.py"
      - ".github/workflows/threads-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            threads
            scripts
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Tarik insights
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python3 scripts/threads_stats.py
      - name: Simpan
        run: |
          if [ -n "$(git status --porcelain threads/stats.json)" ]; then
            git config user.name "tmxlab-bot"
            git config user.email "actions@users.noreply.github.com"
            git add threads/stats.json
            git commit -m "threads: stats harian"
            git pull --rebase -q || true
            git push
          fi
