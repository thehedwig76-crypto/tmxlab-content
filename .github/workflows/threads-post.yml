name: Threads auto post

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/threads_post.py"
      - ".github/workflows/threads-post.yml"
      - "threads/posts.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "post atau check (test token je)"
        default: "check"
        type: choice
        options: [check, post]

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            threads
            scripts
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Post yang dah sampai masa
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          MODE: ${{ github.event_name == 'push' && 'check' || github.event.inputs.mode || 'post' }}
        run: python3 scripts/threads_post.py

      - name: Simpan rekod
        run: |
          if [ -n "$(git status --porcelain threads/posted.json)" ]; then
            git config user.name "tmxlab-bot"
            git config user.email "actions@users.noreply.github.com"
            git add threads/posted.json
            git commit -m "threads: rekod post"
            git pull --rebase -q || true
            git push
          fi
